{% extends "base.html" %}

{% block title %}Server Error | Campus Register{% endblock %}

{% block content %}
<section class="error-section">
    <div class="error-panel">
        <span class="error-code">500</span>
        <h1>Something went wrong on the server.</h1>
        <p>Please try the action again. If the issue persists, review the server logs for more detail.</p>
        <a href="{{ url_for('dashboard.index') if session.get('admin_id') else url_for('auth.login') }}" class="btn btn-campus">
            Return to Main Page
        </a>
    </div>
</section>
{% endblock %}

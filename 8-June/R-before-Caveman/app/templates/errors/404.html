{% extends "layout.html" %}

{% block title %}Page Not Found | College Registration Management{% endblock %}

{% block content %}
<section class="content-card mx-auto" style="max-width: 720px;">
    <div class="card-body p-4 p-lg-5 text-center">
        <span class="eyebrow">404 Error</span>
        <h1 class="section-title mt-2">We could not find that page</h1>
        <p class="text-muted mb-4">{{ message or "The page you are trying to reach is unavailable." }}</p>
        <a href="{{ url_for('dashboard.home') if session.get('admin_logged_in') else url_for('auth.login') }}" class="btn btn-campus">Return to Safety</a>
    </div>
</section>
{% endblock %}

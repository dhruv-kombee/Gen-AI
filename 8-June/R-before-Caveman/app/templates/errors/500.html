{% extends "layout.html" %}

{% block title %}Server Error | College Registration Management{% endblock %}

{% block content %}
<section class="content-card mx-auto" style="max-width: 720px;">
    <div class="card-body p-4 p-lg-5 text-center">
        <span class="eyebrow">500 Error</span>
        <h1 class="section-title mt-2">Something unexpected happened</h1>
        <p class="text-muted mb-4">The application hit an internal error. Please try again, or return to the dashboard.</p>
        <a href="{{ url_for('dashboard.home') if session.get('admin_logged_in') else url_for('auth.login') }}" class="btn btn-campus">Go Back</a>
    </div>
</section>
{% endblock %}

{% extends "layout.html" %}

{% block title %}Bad Request | College Registration Management{% endblock %}

{% block content %}
<section class="content-card mx-auto" style="max-width: 720px;">
    <div class="card-body p-4 p-lg-5 text-center">
        <span class="eyebrow">400 Error</span>
        <h1 class="section-title mt-2">The request could not be processed</h1>
        <p class="text-muted mb-4">Some required information was missing or invalid. Please review the request and try again.</p>
        <a href="{{ url_for('dashboard.home') if session.get('admin_logged_in') else url_for('auth.login') }}" class="btn btn-campus">Return</a>
    </div>
</section>
{% endblock %}
